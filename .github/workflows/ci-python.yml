name: ci-python

on:
  push:
    paths:
      - "python/**"
      - "services/ai-api/**"
      - "tests/sync-gold/**"
      - "scripts/generate_sync_wavs.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci-python.yml"
  pull_request:
    paths:
      - "python/**"
      - "services/ai-api/**"
      - "tests/sync-gold/**"
      - "pyproject.toml"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.14"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen || uv sync
      - run: uv run python scripts/generate_sync_wavs.py
      - run: uv run pytest -q
      - run: uv run python scripts/check_cross_language_contracts.py
