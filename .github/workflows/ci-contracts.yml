name: ci-contracts

on:
  push:
    paths:
      - "packages/contracts/**"
      - "python/kedo-ai-core/**"
      - "python/tests/test_cross_language_edit_plan.py"
      - "scripts/check_cross_language_contracts.py"
      - "database/migrations/postgres/**"
      - ".github/workflows/ci-contracts.yml"
  pull_request:
    paths:
      - "packages/contracts/**"
      - "python/kedo-ai-core/**"
      - "python/tests/test_cross_language_edit_plan.py"
      - "scripts/check_cross_language_contracts.py"
      - "database/migrations/postgres/**"

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.14"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kedov/contracts build
      - run: pnpm --filter @kedov/contracts test
      - run: uv sync --frozen || uv sync
      - run: uv run python scripts/check_cross_language_contracts.py
      - run: uv run pytest -q python/tests/test_cross_language_edit_plan.py
